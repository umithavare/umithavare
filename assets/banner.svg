<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="226" viewBox="0 0 1000 226">
  <title>Ümit Havare</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#70a5fd" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#38bdae" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#70a5fd"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#30363d"/>
    </pattern>
    <mask id="dotmask"><rect width="1000" height="226" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1000" height="226" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="226" fill="url(#bg)"/>
    <rect width="1000" height="226" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1000" height="226" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="225" rx="16" fill="none" stroke="#30363d"/>

  <g font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="56" y="70" fill="#38bdae" font-size="14" font-weight="600" letter-spacing="3">SOFTWARE DEVELOPER · WECHIP · ISTANBUL</text>
    <text x="52" y="140" fill="url(#name)" font-size="68" font-weight="700" letter-spacing="-1">Ümit Havare</text>
    <text x="56" y="180" fill="#8b949e" font-size="21">Building payment infrastructure and backend systems on .NET</text>
  </g>
</svg>
